name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "25 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:

    runs-on: ubuntu-latest

    steps:

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: SOHAM830-star
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?palette=github-dark

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
