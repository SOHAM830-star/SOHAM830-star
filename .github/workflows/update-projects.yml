name: Update GitHub Projects

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Cyber Project Console
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: SOHAM830-star
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape
          from datetime import datetime

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "SOHAM830-star-project-updater",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          # Only show public, original, non-archived repositories.
          repos = [
              repo for repo in repos
              if not repo["private"]
              and not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != username.lower()
          ]

          # Newest activity first.
          repos.sort(
              key=lambda repo: (
                  repo.get("pushed_at") or "",
                  repo.get("updated_at") or "",
                  repo.get("stargazers_count", 0),
                  repo.get("forks_count", 0),
              ),
              reverse=True,
          )

          repos = repos[:6]

          def language_color(language):
              colors = {
                  "Python": "#3776AB",
                  "JavaScript": "#F7DF1E",
                  "TypeScript": "#3178C6",
                  "C": "#A8B9CC",
                  "C++": "#00599C",
                  "Java": "#ED8B00",
                  "HTML": "#E34F26",
                  "CSS": "#1572B6",
                  "SQL": "#4169E1",
                  "Shell": "#89E051",
                  "Arduino": "#00979D",
              }
              return colors.get(language, "#00F7FF")

          def format_date(value):
              if not value:
                  return "Unknown"

              try:
                  date = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  return date.strftime("%d %b %Y")
              except Exception:
                  return "Unknown"

          cards = []

          for index, repo in enumerate(repos, start=1):
              name = escape(repo["name"])
              description = escape(
                  repo.get("description")
                  or "No description provided."
              )

              if len(description) > 125:
                  description = description[:122] + "..."

              language = repo.get("language") or "Code"
              language = escape(language)

              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)

              updated = format_date(
                  repo.get("pushed_at") or repo.get("updated_at")
              )

              repo_url = escape(repo["html_url"], quote=True)
              lang_color = language_color(repo.get("language"))

              card = f"""
              <td width="50%" valign="top">

              <a href="{repo_url}">
              <img src="https://img.shields.io/badge/PROJECT%20{index}-00F7FF?style=for-the-badge&labelColor=0B1020&color=00F7FF" alt="Project {index}">
              </a>

              <br><br>

              <a href="{repo_url}">
              <h3>{name}</h3>
              </a>

              <p>{description}</p>

              <p>
              <img src="https://img.shields.io/badge/{language}-111827?style=flat-square&labelColor=111827&color={lang_color.lstrip('#')}" alt="{language}">
              <img src="https://img.shields.io/badge/⭐%20{stars}-111827?style=flat-square" alt="{stars} stars">
              <img src="https://img.shields.io/badge/🍴%20{forks}-111827?style=flat-square" alt="{forks} forks">
              </p>

              <sub>LAST PUSH: {updated}</sub>

              <br><br>

              </td>
              """

              cards.append(card)

          if not cards:
              project_html = """
              <div align="center">

              ### `NO PUBLIC BUILDS DETECTED`

              Create a public repository and push your first project.

              </div>
              """
          else:
              rows = []

              for i in range(0, len(cards), 2):
                  row = "<tr>\n" + "\n".join(cards[i:i+2]) + "\n</tr>"
                  rows.append(row)

              project_html = f"""
              <div align="center">

              <img src="https://img.shields.io/badge/AUTO--SYNC-ONLINE-00F7FF?style=for-the-badge&labelColor=0B1020" alt="Auto Sync">

              <br><br>

              <table>
              {''.join(rows)}
              </table>

              <br>

              <sub>
              SHOWING 6 LATEST PUBLIC BUILDS • AUTO-UPDATED EVERY 6 HOURS
              </sub>

              </div>
              """

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          if start_marker not in readme or end_marker not in readme:
              raise SystemExit(
                  "Project markers were not found in README.md"
              )

          before = readme.split(start_marker, 1)[0]
          after = readme.split(end_marker, 1)[1]

          updated_readme = (
              before
              + start_marker
              + "\n"
              + project_html.strip()
              + "\n"
              + end_marker
              + after
          )

          readme_path.write_text(
              updated_readme,
              encoding="utf-8"
          )
          PY

      - name: Commit project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No project changes detected."
          else
            git commit -m "chore: update cyber project console"
            git push
          fi
