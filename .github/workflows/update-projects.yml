name: Update GitHub Projects

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate project console
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: SOHAM830-star
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from html import escape
          from datetime import datetime

          username = os.environ["GH_USERNAME"]

          result = subprocess.run(
              [
                  "gh",
                  "repo",
                  "list",
                  username,
                  "--limit", "100",
                  "--visibility", "public",
                  "--json",
                  "name,url,description,primaryLanguage,stargazerCount,forkCount,isFork,isArchived,updatedAt"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          repos = json.loads(result.stdout)

          repos = [
              repo for repo in repos
              if not repo["isFork"]
              and not repo["isArchived"]
              and repo["name"].lower() != username.lower()
          ]

          repos.sort(
              key=lambda repo: (
                  repo.get("updatedAt") or "",
                  repo.get("stargazerCount", 0),
                  repo.get("forkCount", 0)
              ),
              reverse=True
          )

          repos = repos[:6]

          def language_color(language):
              colors = {
                  "Python": "3776AB",
                  "JavaScript": "F7DF1E",
                  "TypeScript": "3178C6",
                  "C": "A8B9CC",
                  "C++": "00599C",
                  "Java": "ED8B00",
                  "HTML": "E34F26",
                  "CSS": "1572B6",
                  "SQL": "4169E1",
                  "Shell": "89E051",
                  "Arduino": "00979D"
              }

              return colors.get(language, "00F7FF")

          cards = []

          for index, repo in enumerate(repos, start=1):

              name = escape(repo["name"])

              description = escape(
                  repo.get("description")
                  or "No description provided."
              )

              if len(description) > 120:
                  description = description[:117] + "..."

              language_data = repo.get("primaryLanguage")
              language = (
                  language_data["name"]
                  if language_data
                  else "Code"
              )

              language = escape(language)

              stars = repo.get("stargazerCount", 0)
              forks = repo.get("forkCount", 0)

              updated = repo.get("updatedAt", "")

              try:
                  updated = datetime.fromisoformat(
                      updated.replace("Z", "+00:00")
                  ).strftime("%d %b %Y")
              except Exception:
                  updated = "Unknown"

              repo_url = escape(
                  repo["url"],
                  quote=True
              )

              lang_color = language_color(language)

              cards.append(f"""
              <td width="50%" valign="top">

              <a href="{repo_url}">
              <img src="https://img.shields.io/badge/PROJECT%20{index}-00F7FF?style=for-the-badge&labelColor=0B1020&color=00F7FF">
              </a>

              <br><br>

              <a href="{repo_url}">
              <h3>{name}</h3>
              </a>

              <p>{description}</p>

              <p>
              <img src="https://img.shields.io/badge/{language}-111827?style=flat-square&color={lang_color}">
              <img src="https://img.shields.io/badge/⭐%20{stars}-111827?style=flat-square">
              <img src="https://img.shields.io/badge/🍴%20{forks}-111827?style=flat-square">
              </p>

              <sub>UPDATED: {updated}</sub>

              <br><br>

              </td>
              """)

          if cards:

              rows = []

              for i in range(0, len(cards), 2):
                  rows.append(
                      "<tr>\n"
                      + "\n".join(cards[i:i+2])
                      + "\n</tr>"
                  )

              project_html = f"""
              <div align="center">

              <img src="https://img.shields.io/badge/AUTO--SYNC-ONLINE-00F7FF?style=for-the-badge&labelColor=0B1020">

              <br><br>

              <table>
              {''.join(rows)}
              </table>

              <br>

              <sub>
              SHOWING {len(repos)} LATEST PUBLIC BUILDS • AUTO-UPDATED EVERY 6 HOURS
              </sub>

              </div>
              """

          else:

              project_html = """
              <div align="center">

              ### `NO PUBLIC BUILDS DETECTED`

              Create a public repository and push your first project.

              </div>
              """

          readme_path = Path("README.md")
          readme = readme_path.read_text(
              encoding="utf-8"
          )

          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"

          if start not in readme or end not in readme:
              raise SystemExit(
                  "PROJECTS markers are missing from README.md"
              )

          before = readme.split(start, 1)[0]
          after = readme.split(end, 1)[1]

          readme = (
              before
              + start
              + "\n"
              + project_html.strip()
              + "\n"
              + end
              + after
          )

          readme_path.write_text(
              readme,
              encoding="utf-8"
          )
          PY

      - name: Commit project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update cyber project console"
            git push
          fi
